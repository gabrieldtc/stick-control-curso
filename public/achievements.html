<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistas - Do Travesseiro ao Groove</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">🥁 Do Travesseiro ao Groove</div>
        <div class="navbar-menu">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/curso" class="nav-link">Curso</a>
            <a href="/conquistas" class="nav-link active">Conquistas</a>
            <a href="#" onclick="logout()" class="nav-link">Sair</a>
        </div>
    </div>
    
    <div class="achievements-container">
        <h1>🏆 Suas Conquistas</h1>
        
        <div class="achievements-stats">
            <div class="stat-card">
                <div class="stat-number" id="achievements-count">0</div>
                <div class="stat-label">Conquistas Desbloqueadas</div>
            </div>
        </div>
        
        <div class="achievements-grid" id="achievements-list">
            <p class="loading">Carregando conquistas...</p>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAchievements);
        
        async function loadAchievements() {
            const token = localStorage.getItem('token');
            if (!token) {
                location.href = '/';
                return;
            }
            
            try {
                const res = await fetch('/api/achievements', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Erro ao carregar conquistas');
                
                const data = await res.json();
                renderAchievements(data.achievements, data.all);
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('achievements-list').innerHTML = '<p class="error">Erro ao carregar conquistas</p>';
            }
        }
        
        function renderAchievements(unlocked, all) {
            const unlockedIds = new Set(unlocked.map(a => a.badge_name));
            document.getElementById('achievements-count').textContent = unlocked.length;
            
            const list = document.getElementById('achievements-list');
            
            list.innerHTML = all.map(achievement => {
                const isUnlocked = unlockedIds.has(achievement.id);
                return `
                    <div class="achievement-card ${isUnlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-icon">${achievement.icon || '🏅'}</div>
                        <h3>${achievement.name}</h3>
                        <p>${achievement.description}</p>
                        ${isUnlocked ? '<span class="badge-status">✓ Desbloqueada</span>' : '<span class="badge-status">🔒 Bloqueada</span>'}
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
