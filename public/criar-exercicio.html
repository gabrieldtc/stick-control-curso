<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Exercício - Do Travesseiro ao Groove</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">🥁 Do Travesseiro ao Groove</div>
        <div class="navbar-menu">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/curso" class="nav-link">Curso</a>
            <a href="#" onclick="logout()" class="nav-link">Sair</a>
        </div>
    </div>
    
    <div class="criar-exercicio-container">
        <h1>✨ Criar Exercício Personalizado</h1>
        
        <div class="form-container">
            <form id="exercise-form">
                <div class="form-group">
                    <label>Nome do Exercício</label>
                    <input type="text" id="exercise-name" placeholder="Ex: Meu exercício de velocidade" required>
                </div>
                
                <div class="form-group">
                    <label>Sequência</label>
                    <textarea id="exercise-sequence" placeholder="Ex: RLRL LRLR RRLL LLRR" required></textarea>
                    <small>R = Direita, L = Esquerda</small>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>BPM Alvo</label>
                        <input type="number" id="bpm-target" value="120" min="40" max="300">
                    </div>
                    
                    <div class="form-group">
                        <label>Range Mínimo de BPM</label>
                        <input type="number" id="bpm-min" value="40" min="40" max="300">
                    </div>
                    
                    <div class="form-group">
                        <label>Range Máximo de BPM</label>
                        <input type="number" id="bpm-max" value="200" min="40" max="300">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Notas por Beat</label>
                        <input type="number" id="notes-per-beat" value="2" min="1" max="8">
                    </div>
                    
                    <div class="form-group">
                        <label>Compasso</label>
                        <select id="time-signature">
                            <option value="4">4/4</option>
                            <option value="3">3/4</option>
                            <option value="2">2/4</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Criar Exercício</button>
            </form>
        </div>
        
        <h2>Seus Exercícios</h2>
        <div class="exercises-list" id="exercises-list">
            <p class="loading">Carregando exercícios...</p>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
    <script>
        document.getElementById('exercise-form').addEventListener('submit', createExercise);
        document.addEventListener('DOMContentLoaded', loadExercises);
        
        async function createExercise(e) {
            e.preventDefault();
            
            const token = localStorage.getItem('token');
            if (!token) {
                location.href = '/';
                return;
            }
            
            const exercise = {
                nome: document.getElementById('exercise-name').value,
                sequencia: document.getElementById('exercise-sequence').value,
                bpm_alvo: parseInt(document.getElementById('bpm-target').value),
                bpm_range_min: parseInt(document.getElementById('bpm-min').value),
                bpm_range_max: parseInt(document.getElementById('bpm-max').value),
                notes_per_beat: parseInt(document.getElementById('notes-per-beat').value),
                time_signature: parseInt(document.getElementById('time-signature').value)
            };
            
            try {
                const res = await fetch('/api/user-exercises', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(exercise)
                });
                
                if (res.ok) {
                    alert('✅ Exercício criado com sucesso!');
                    document.getElementById('exercise-form').reset();
                    loadExercises();
                } else {
                    alert('❌ Erro ao criar exercício');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro ao criar exercício');
            }
        }
        
        async function loadExercises() {
            const token = localStorage.getItem('token');
            if (!token) {
                location.href = '/';
                return;
            }
            
            try {
                const res = await fetch('/api/user-exercises', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const exercises = await res.json();
                    renderExercises(exercises);
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }
        
        function renderExercises(exercises) {
            const list = document.getElementById('exercises-list');
            
            if (exercises.length === 0) {
                list.innerHTML = '<p class="empty">Nenhum exercício criado ainda</p>';
                return;
            }
            
            list.innerHTML = exercises.map(ex => `
                <div class="exercise-card">
                    <h3>${ex.nome}</h3>
                    <p><strong>Sequência:</strong> ${ex.sequencia}</p>
                    <p><strong>BPM Alvo:</strong> ${ex.bpm_alvo} (${ex.bpm_range_min}-${ex.bpm_range_max})</p>
                    <p><strong>Criado em:</strong> ${new Date(ex.created_at).toLocaleDateString('pt-BR')}</p>
                    <button class="btn-small" onclick="practiceExercise(${ex.id})">Praticar</button>
                </div>
            `).join('');
        }
        
        function practiceExercise(id) {
            alert('🎵 Iniciar prática do exercício #' + id);
        }
    </script>
</body>
</html>
