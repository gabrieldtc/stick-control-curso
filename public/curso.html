<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - Do Travesseiro ao Groove</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">🥁 Do Travesseiro ao Groove</div>
        <div class="navbar-menu">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/curso" class="nav-link active">Curso</a>
            <a href="/conquistas" class="nav-link">Conquistas</a>
            <a href="#" onclick="logout()" class="nav-link">Sair</a>
        </div>
    </div>
    
    <div class="curso-container">
        <h1>📚 Capítulos do Curso</h1>
        
        <div class="filter-controls">
            <input type="text" id="search-chapters" placeholder="Procurar capítulo..." class="search-input">
        </div>
        
        <div class="chapters-grid" id="chapters-list">
            <p class="loading">Carregando capítulos...</p>
        </div>
    </div>
    
    <script src="/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadChapters);
        document.getElementById('search-chapters').addEventListener('input', filterChapters);
        
        let allChapters = [];
        
        async function loadChapters() {
            const token = localStorage.getItem('token');
            if (!token) {
                location.href = '/';
                return;
            }
            
            try {
                const res = await fetch('/api/chapters', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Erro ao carregar capítulos');
                
                allChapters = await res.json();
                renderChapters(allChapters);
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('chapters-list').innerHTML = '<p class="error">Erro ao carregar capítulos</p>';
            }
        }
        
        function renderChapters(chapters) {
            const list = document.getElementById('chapters-list');
            
            if (chapters.length === 0) {
                list.innerHTML = '<p class="empty">Nenhum capítulo encontrado</p>';
                return;
            }
            
            list.innerHTML = chapters.map(ch => `
                <div class="chapter-card">
                    <div class="chapter-number">${ch.id}</div>
                    <h3>${ch.title || 'Capítulo ' + ch.id}</h3>
                    <p>${ch.description || 'Aprenda técnicas essenciais'}</p>
                    <button class="btn-small" onclick="viewChapter(${ch.id})">Acessar →</button>
                </div>
            `).join('');
        }
        
        function filterChapters() {
            const search = document.getElementById('search-chapters').value.toLowerCase();
            const filtered = allChapters.filter(ch => 
                (ch.title || '').toLowerCase().includes(search) ||
                (ch.description || '').toLowerCase().includes(search)
            );
            renderChapters(filtered);
        }
        
        function viewChapter(id) {
            location.href = '/teste?chapter=' + id;
        }
    </script>
</body>
</html>
