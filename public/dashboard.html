<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Do Travesseiro ao Groove</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">🥁 Do Travesseiro ao Groove</div>
        <div class="navbar-menu">
            <a href="/intro" class="nav-link">Início</a>
            <a href="/dashboard" class="nav-link active">Dashboard</a>
            <a href="/curso" class="nav-link">Curso</a>
            <a href="/conquistas" class="nav-link">Conquistas</a>
            <a href="#" onclick="logout()" class="nav-link">Sair</a>
        </div>
    </div>
    
    <div class="dashboard-container">
        <h1>Dashboard</h1>
        <p>Olá, <strong id="dashboard-name">Usuário</strong>!</p>
        
        <div class="dashboard-grid">
            <div class="card">
                <h3>📈 Seu Progresso</h3>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p id="progress-text">0 / 75 capítulos</p>
            </div>
            
            <div class="card">
                <h3>⚡ Velocidade Máxima</h3>
                <div class="stat-large" id="max-bpm">60 BPM</div>
            </div>
            
            <div class="card">
                <h3>⏱️ Tempo de Prática</h3>
                <div class="stat-large" id="practice-time">0h</div>
            </div>
            
            <div class="card">
                <h3>🔥 Sequência</h3>
                <div class="stat-large" id="streak">0 dias</div>
            </div>
        </div>
        
        <div class="dashboard-actions">
            <button class="btn-primary" onclick="location.href='/curso'">Continuar Curso →</button>
            <button class="btn-secondary" onclick="location.href='/conquistas'">Ver Conquistas</button>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadDashboard);
        
        async function loadDashboard() {
            const token = localStorage.getItem('token');
            if (!token) {
                location.href = '/';
                return;
            }
            
            try {
                const res = await fetch('/api/user', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Erro ao carregar dados');
                
                const user = await res.json();
                document.getElementById('dashboard-name').textContent = user.name;
                
                // Carregar progresso
                const progressRes = await fetch('/api/user/progress', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (progressRes.ok) {
                    const progress = await progressRes.json();
                    updateDashboardStats(progress);
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }
        
        function updateDashboardStats(progress) {
            const completed = progress.filter(p => p.completed).length;
            const total = 75;
            const percentage = (completed / total) * 100;
            
            document.getElementById('progress-fill').style.width = percentage + '%';
            document.getElementById('progress-text').textContent = `${completed} / ${total} capítulos`;
            
            const maxBpm = Math.max(...progress.map(p => p.max_bpm || 0), 60);
            document.getElementById('max-bpm').textContent = maxBpm + ' BPM';
            
            const totalTime = progress.reduce((sum, p) => sum + (p.practice_time || 0), 0);
            const hours = Math.round(totalTime / 60);
            document.getElementById('practice-time').textContent = hours + 'h';
        }
    </script>
</body>
</html>
