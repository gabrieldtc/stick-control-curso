<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticar - Do Travesseiro ao Groove</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">🥁 Do Travesseiro ao Groove</div>
        <div class="navbar-menu">
            <a href="/curso" class="nav-link">← Voltar</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="#" onclick="logout()" class="nav-link">Sair</a>
        </div>
    </div>
    
    <div class="practice-container">
        <h1 id="chapter-title">Praticar Capítulo</h1>
        
        <div class="practice-content">
            <div id="chapter-content" class="chapter-content">
                <p class="loading">Carregando conteúdo...</p>
            </div>
            
            <div class="practice-controls">
                <div class="metronome-section">
                    <h3>🎯 Metrônomo</h3>
                    
                    <div class="bpm-control">
                        <label>BPM: <input type="number" id="bpm-input" value="60" min="40" max="300"></label>
                        <button class="btn-small" onclick="playMetronome()">Tocar</button>
                        <button class="btn-small" onclick="stopMetronome()">Parar</button>
                    </div>
                    
                    <div class="practice-stats">
                        <p>⏱️ Tempo: <span id="practice-timer">0:00</span></p>
                        <p>⚡ Seu Melhor: <span id="personal-best">60 BPM</span></p>
                    </div>
                </div>
                
                <div class="completion-section">
                    <button class="btn-primary" onclick="completeChapter()">Marcar como Concluído</button>
                    <button class="btn-secondary" onclick="testChapter()">Testar Capítulo</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/app.js"></script>
    <script>
        let currentChapter = null;
        let metronomeActive = false;
        let practiceStartTime = null;
        
        document.addEventListener('DOMContentLoaded', loadChapter);
        
        async function loadChapter() {
            const token = localStorage.getItem('token');
            if (!token) {
                location.href = '/';
                return;
            }
            
            const params = new URLSearchParams(window.location.search);
            const chapterId = params.get('chapter') || 0;
            
            try {
                const res = await fetch(`/api/chapters/${chapterId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Capítulo não encontrado');
                
                currentChapter = await res.json();
                renderChapter();
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('chapter-content').innerHTML = '<p class="error">Erro ao carregar capítulo</p>';
            }
        }
        
        function renderChapter() {
            document.getElementById('chapter-title').textContent = `Capítulo ${currentChapter.id}: ${currentChapter.title}`;
            
            let html = `
                <h2>${currentChapter.title}</h2>
                <p>${currentChapter.description || ''}</p>
            `;
            
            if (currentChapter.exercise && currentChapter.exercise.length > 0) {
                html += '<h3>Exercícios:</h3><ul>';
                currentChapter.exercise.forEach(ex => {
                    html += `<li>${ex}</li>`;
                });
                html += '</ul>';
            }
            
            document.getElementById('chapter-content').innerHTML = html;
            practiceStartTime = Date.now();
        }
        
        function playMetronome() {
            if (metronomeActive) return;
            metronomeActive = true;
            alert('🎵 Metrônomo iniciado! BPM: ' + document.getElementById('bpm-input').value);
            updateTimer();
        }
        
        function stopMetronome() {
            metronomeActive = false;
        }
        
        function updateTimer() {
            if (!metronomeActive) return;
            
            const elapsed = Math.floor((Date.now() - practiceStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            
            document.getElementById('practice-timer').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            setTimeout(updateTimer, 1000);
        }
        
        async function completeChapter() {
            const token = localStorage.getItem('token');
            const bpm = parseInt(document.getElementById('bpm-input').value);
            const elapsed = Math.floor((Date.now() - practiceStartTime) / 60);
            
            try {
                const res = await fetch('/api/user/progress', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chapter_id: currentChapter.id,
                        completed: true,
                        max_bpm: bpm,
                        practice_time: elapsed
                    })
                });
                
                if (res.ok) {
                    alert('✅ Capítulo concluído!');
                    location.href = '/curso';
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }
        
        function testChapter() {
            alert('📋 Teste do capítulo (em desenvolvimento)');
        }
    </script>
</body>
</html>
